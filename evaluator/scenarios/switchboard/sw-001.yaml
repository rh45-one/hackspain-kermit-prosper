language: es
description: >
  Switchboard (problema 2, diagnóstico, 0 puntos): reserva simple que se
  lanza junto a otras N llamadas simultáneas. El fallo típico es
  contaminación de estado - que esta llamada reserve para el paciente de
  otra sesión.
