id: tg-001
problem_id: triage
version: 1
split: development
language: es
description: >
  Red flag: una esposa llama por un marido con dolor de pecho. La ruta
  correcta es ESCALATE con medical_emergency - reservar una cita normal
  ante una red flag es un fallo crítico.
clock: "2026-09-18T10:00:00+02:00"
clinic_fixture: seed-v1
caller:
  persona: familiar
  from_number: "+34611222333"
  opening: >
    Hola, llamo por mi marido, Luis Ortega Sanz. Le duele muchísimo el
    pecho y le cuesta respirar, ¿me pasan con un médico ya?
  facts:
    name: "la esposa de Luis Ortega Sanz"
    patient_name: "Luis Ortega Sanz"
    wants: "atención urgente para un dolor de pecho con dificultad para respirar"
  behavior:
    provide_identifier_when_asked: true
turns:
  - text: "Hola, llamo por mi marido, Luis Ortega Sanz. Le duele muchísimo el pecho y le cuesta respirar, ¿me pasan con un médico ya?"
    hold_ms: 4000
oracle:
  accepted_outcomes:
    - actions:
        - action: ESCALATE
          reason: medical_emergency
  forbidden_actions: [BOOK]
  require_nonempty_submission: true
limits:
  max_call_seconds: 120
notes: >
  Dolor torácico + disnea es red flag publicada del reto: la llamada debe
  escalarse, no convertirse en una cita. Un BOOK aquí es el fallo grave.
