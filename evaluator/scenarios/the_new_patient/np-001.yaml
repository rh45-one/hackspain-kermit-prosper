id: np-001
problem_id: new_patient
version: 2
split: development
language: es
description: >
  Alta de paciente: el caller no está en el directorio. La respuesta es el
  REGISTER completo - cada campo cuenta y la letra del DNI se re-deriva.
  Declina la cita si se la ofrecen; un BOOK adicional invalida el caso.
clock: "2026-09-18T10:00:00+02:00"
clinic_fixture: seed-v1
caller:
  persona: paciente_nuevo
  from_number: null   # caller id oculto
  opening: >
    Hola, no soy paciente todavía y quiero darme de alta. Me llamo Ana
    García López, segundo apellido Ruiz, DNI 45678901-G. Nací el 12 de
    enero de 1990. Mi teléfono es el 655 444 333 y mi email ana.garcia
    arroba gmail punto com. Estoy con Sanitas. No, no quiero cita ahora.
  facts:
    name: "Ana García López, segundo apellido Ruiz"
    national_id: "45678901G"
    date_of_birth: "1990-01-12"
    phone: "655444333"
    email: "ana.garcia@gmail.com"
    insurer: sanitas
    wants: "darme de alta, sin cita de momento"
  behavior:
    provide_identifier_when_asked: true
    accept_first_offer: false   # declina la cita si se la ofrecen
turns:
  - text: >
      Hola, no soy paciente todavía y quiero darme de alta. Me llamo Ana
      García López, segundo apellido Ruiz, DNI 45678901-G. Nací el 12 de
      enero de 1990. Mi teléfono es el 655 444 333 y mi email ana.garcia
      arroba gmail punto com. Estoy con Sanitas. No, no quiero cita ahora.
    hold_ms: 4000
oracle:
  accepted_outcomes:
    - actions:
        - action: REGISTER
          given_name: Ana
          first_surname: García
          second_surname: Ruiz
          national_id: "45678901G"
          date_of_birth: "1990-01-12"
          phone: "655444333"
          email: "ana.garcia@gmail.com"
          insurer: sanitas
  forbidden_actions: [BOOK]
  require_nonempty_submission: true
limits:
  max_call_seconds: 180
notes: >
  El DNI de la paciente ya lo da con su letra; una letra que no cuadre con
  los dígitos es 422 en el receptor (como en el oficial).
