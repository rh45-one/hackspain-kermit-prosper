# Smoke test del propio evaluador con el agente "double":
# un candidato acierta, otro muta un campo, otro no envía nada.
name: evaluator-smoke
rules_version: "scoring-2.0-draft"
reference_now: "2026-09-18T10:00:00+02:00"
clinic_dataset: ../data/clinic_dataset.json
clinic_port: 18090
submit_key: pk-local-eval
repetitions: 1
# El doble envía en cuanto cae el socket: no hace falta esperar a un
# flush tardío como con un agente real.
submit_drain_s: 0.5
candidates:
  - name: double-correct
    kind: double
    port: 18770
    mode: correct
  - name: double-wrong
    kind: double
    port: 18771
    mode: mutate
  - name: double-silent
    kind: double
    port: 18772
    mode: silent
scenarios:
  - ../scenarios/**/*.yaml
