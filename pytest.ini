; Root-level pytest config so the acceptance commands run from the repository
; root (e.g. `uv run --project backend pytest -q`) still see the backend test
; suite and its settings. Keep the three values in sync with
; backend/pyproject.toml [tool.pytest.ini_options], which is used when pytest
; is invoked from inside backend/.
[pytest]
asyncio_mode = auto
pythonpath = backend/src
testpaths = backend/tests
