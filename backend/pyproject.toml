[project]
name = "prosper-agent"
version = "0.1.0"
description = "HackSpain 2026 Prosper track - ClinicReflow voice scheduling agent"
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[deepgram,elevenlabs,google,openai,rnnoise,silero]>=0.0.70",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "websockets>=13.0",
    "audiolab<0.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
# Backend-relative config, used when pytest runs from backend/.
# The repository root has a pytest.ini mirror for runs from the root.
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
