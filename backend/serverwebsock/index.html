<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' ws: wss:; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    >
    <meta name="theme-color" content="#f6f6f2">
    <title>Pronto | Llamada de prueba</title>
    <link rel="icon" href="./mark.svg">
    <link rel="stylesheet" href="./styles.css">
    <script src="./app.js" defer></script>
  </head>
  <body>
    <header class="app-header">
      <div class="header-inner">
        <div class="brand-lockup" aria-label="Pronto, Clínica Arenal">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 64 64">
              <g transform="translate(0.31 0)">
                <path fill="currentColor" d="M14 56V26A18 18 0 0 1 49.386665 21.341257L41.659258 23.41181A10 10 0 1 0 41.659258 28.58819L49.386665 30.658743A18 18 0 0 1 24.8 42.497273A2 2 0 0 0 22 44.330303V56Z"/>
              </g>
            </svg>
          </div>
          <div>
            <p class="product-name">Pronto</p>
            <p class="clinic-name">Clínica Arenal</p>
          </div>
        </div>
        <p class="header-status" id="link-status" data-state="offline" role="status" aria-live="polite">
          <span class="header-status-dot" aria-hidden="true"></span>
          <span class="header-status-label">Offline</span>
        </p>
      </div>
    </header>

    <main class="call-shell">
      <p class="kicker" id="page-kicker"><span aria-hidden="true"></span> Recepción virtual</p>
      <h1 id="page-title">Habla con recepción.</h1>
      <p class="intro" id="page-intro">Simulación local. No se envían acciones a Prosper.</p>
      <!--
        Cuando la llamada sale de la clínica, aquí se dice a quién se llama y
        para qué antes de descolgar. Sin esto la página decía "Habla con
        recepción" mientras el agente, por debajo, llamaba a un jefe de
        servicio: quien escanea el QR no tiene forma de saber qué llamada va
        a empezar.
      -->
      <p class="intro" id="call-purpose" hidden></p>

      <section class="call-panel" aria-labelledby="page-title">
        <div class="call-meta">
          <span>Canal de prueba</span>
          <span>Micrófono requerido</span>
        </div>
        <button id="call-button" class="call-button" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6.6 10.8a15.5 15.5 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1.1-.2 1.2.4 2.5.6 3.8.6.5 0 .9.4.9.9v3.4c0 .5-.4.9-.9.9A17.1 17.1 0 0 1 3.2 3.7c0-.5.4-.9.9-.9h3.4c.5 0 .9.4.9.9 0 1.3.2 2.6.6 3.8.1.4 0 .8-.2 1.1l-2.2 2.2Z"/>
          </svg>
          <span id="call-label">Iniciar llamada</span>
        </button>
        <p id="call-status" class="status" role="status" aria-live="polite">Lista para llamar</p>
        <p class="privacy-note">Solicitaremos acceso al micrófono al iniciar.</p>
      </section>
    </main>
  </body>
</html>
