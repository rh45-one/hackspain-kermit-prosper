<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' ws: wss:; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    >
    <meta name="theme-color" content="#f4efe6">
    <title>Call Prosper Agent</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="call-shell">
      <section class="call-card" aria-labelledby="page-title">
        <div class="brand" aria-hidden="true">P</div>
        <p class="eyebrow">Prosper clinic</p>
        <h1 id="page-title">Call the scheduling agent</h1>
        <p class="intro">Speak naturally, just as you would on the phone.</p>

        <button id="call-button" class="call-button" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6.6 10.8a15.5 15.5 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1.1-.2 1.2.4 2.5.6 3.8.6.5 0 .9.4.9.9v3.4c0 .5-.4.9-.9.9A17.1 17.1 0 0 1 3.2 3.7c0-.5.4-.9.9-.9h3.4c.5 0 .9.4.9.9 0 1.3.2 2.6.6 3.8.1.4 0 .8-.2 1.1l-2.2 2.2Z"/>
          </svg>
          <span id="call-label">Call</span>
        </button>

        <p id="call-status" class="status" role="status" aria-live="polite">Ready to call</p>
        <p class="privacy-note">Your browser will ask for microphone access when the call starts.</p>
      </section>
    </main>
  </body>
</html>
